name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version tag"
        required: true
        default: "v0.3.1"

permissions:
  contents: write

env:
  PLUGIN_NAME: grok-tool-int-args

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Test
        run: go test .

      - name: Test without CGO
        env:
          CGO_ENABLED: "0"
        run: go test .

      - name: Test with race detector
        run: go test -race .

      - name: Vet
        run: go vet ./...

  build:
    name: Build ${{ matrix.target }}
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: windows-amd64
            goos: windows
            goarch: amd64
            ext: dll
          - os: ubuntu-latest
            target: linux-amd64
            goos: linux
            goarch: amd64
            ext: so
          - os: macos-latest
            target: darwin-arm64
            goos: darwin
            goarch: arm64
            ext: dylib
          - os: ubuntu-24.04-arm
            target: linux-arm64
            goos: linux
            goarch: arm64
            ext: so

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build plugin
        shell: pwsh
        env:
          CGO_ENABLED: "1"
        run: |
          New-Item -ItemType Directory -Path "dist" -Force | Out-Null
          $version = "${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}"
          $pluginVersion = $version.TrimStart("v")
          go build -buildmode=c-shared -ldflags "-X main.pluginVersion=$pluginVersion" -o "dist/${{ env.PLUGIN_NAME }}.${{ matrix.ext }}" .

      - name: Package plugin
        shell: pwsh
        run: |
          $version = "${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}".TrimStart("v")
          $archive = "dist/${{ env.PLUGIN_NAME }}_${version}_${{ matrix.goos }}_${{ matrix.goarch }}.zip"
          Compress-Archive -Path "dist/${{ env.PLUGIN_NAME }}.${{ matrix.ext }}" -DestinationPath $archive -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-assets-${{ matrix.target }}
          path: dist/${{ env.PLUGIN_NAME }}_*.zip
          if-no-files-found: error

  release:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    steps:
      - name: Validate version
        if: github.event_name == 'workflow_dispatch'
        shell: pwsh
        run: |
          if ("${{ inputs.version }}" -notmatch '^v\d+\.\d+\.\d+([\-+][0-9A-Za-z.-]+)?$') {
            throw "Version must look like vMAJOR.MINOR.PATCH"
          }

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Generate checksums
        shell: bash
        run: |
          set -euo pipefail
          cd release-assets
          sha256sum *.zip | sort -k2 > checksums.txt
          cat checksums.txt

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
          target_commitish: ${{ github.sha }}
          files: |
            release-assets/*.zip
            release-assets/checksums.txt
          generate_release_notes: true
